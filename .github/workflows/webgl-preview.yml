name: WebGL Preview

on:
  push:
    branches:
      - "daily/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webgl-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL e publicar preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ausente: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "O GameCI precisa de UNITY_LICENSE, UNITY_EMAIL e UNITY_PASSWORD neste repositório."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-SlimeHub-WebGL-v1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: auto
          buildsPath: build
          buildName: WebGL
          buildMethod: SlimeHub.EditorTools.WebGLBuilder.Build

      - name: Fix artifact ownership
        run: |
          for d in build Library; do
            if [ -d "$d" ]; then sudo chown -R "$(id -u):$(id -g)" "$d"; fi
          done

      - name: Locate WebGL output
        id: webgl
        run: |
          INDEX=$(find build -name index.html -print | head -n 1)
          if [ -z "$INDEX" ]; then
            echo "::error::index.html não encontrado"
            find build -type f | head -200 >&2 || true
            exit 1
          fi
          DIR=$(dirname "$INDEX")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Build em $DIR"
          find "$DIR" -maxdepth 2 -type f -print

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgl-preview
          path: ${{ steps.webgl.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Pages subpath
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.webgl.outputs.dir }}
          destination_dir: preview/${{ github.ref_name }}
          keep_files: true
          force_orphan: false
          enable_jekyll: false

      - name: Publish preview branch
        continue-on-error: true
        env:
          PREVIEW_BRANCH: cursor/preview-slime-merge-2518
          SOURCE_DIR: ${{ steps.webgl.outputs.dir }}
        run: |
          set -euo pipefail
          rm -rf /tmp/preview-site
          mkdir -p /tmp/preview-site
          cp -a "$SOURCE_DIR"/. /tmp/preview-site/
          cd /tmp/preview-site
          git init
          git checkout -b "$PREVIEW_BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Build WebGL de preview (slime-merge)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PREVIEW_BRANCH}"
          sha=$(git rev-parse HEAD)
          echo "preview_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "https://rawcdn.githack.com/${GITHUB_REPOSITORY}/${sha}/index.html" >> "$GITHUB_STEP_SUMMARY"

      - name: Preview URL
        run: |
          echo "Pages: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/${{ github.ref_name }}/"
          echo "Githack usa o SHA impresso no passo anterior."
