<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Slime Hub</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #1b1630;
        color: #f4ffe8;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
        width: min(100vw, calc(100vh * 9 / 16));
        height: min(100vh, calc(100vw * 16 / 9));
        background: #241c3a;
        overflow: hidden;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #241c3a;
        outline: none;
      }
      #loading {
        position: absolute;
        left: 0;
        right: 0;
        top: 46%;
        margin: 0;
        text-align: center;
        letter-spacing: 0.08em;
        font-weight: 700;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" width=540 height=960 tabindex="-1"></canvas>
      <p id="loading">Loading Slime Hub…</p>
    </div>
    <script src="Build/docs.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/docs.data.unityweb",
        frameworkUrl: "Build/docs.framework.js.unityweb",
        codeUrl: "Build/docs.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "SlimeHub",
        productName: "Slime Hub",
        productVersion: "1.0",
        autoSyncPersistentDataPath: true
      }).then(function () {
        var loading = document.querySelector("#loading");
        if (loading) loading.style.display = "none";
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
